[project]
name = "tableshuffle"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "openai==3.16.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "platformdirs>=4.11.8",
    "pydantic>=2.13.5",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
]

[tool.black]
target-version = ["py314"]
